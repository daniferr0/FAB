[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com cdn.tailwindcss.com fonts.googleapis.com www.googletagmanager.com www.google-analytics.com elfsightcdn.com *.elfsightcdn.com elfsight.com *.elfsight.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com *.elfsightcdn.com *.elfsight.com; font-src 'self' fonts.gstatic.com data:; img-src 'self' data: https:; frame-src l.ead.me *.elfsight.com; connect-src 'self' https://*.api.mailchimp.com www.google-analytics.com https://*.google-analytics.com https://analytics.google.com elfsightcdn.com *.elfsightcdn.com elfsight.com *.elfsight.com; base-uri 'self'; form-action 'self' https://rimessa-fab.com; object-src 'none'; upgrade-insecure-requests;"
